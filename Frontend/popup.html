<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Phishing Detector</title>
  <link rel="stylesheet" href="styles.css" />
  <style>
    .history-entry {
      padding: 10px;
      margin: 5px 0;
      border-radius: 4px;
      background: #f5f5f5;
    }
    .history-entry.phishing {
      border-left: 4px solid #ff4444;
    }
    .history-entry.safe {
      border-left: 4px solid #4CAF50;
    }
    .history-entry .url {
      color: #666;
      font-size: 12px;
      word-break: break-all;
    }
    .history-entry .time {
      color: #999;
      font-size: 11px;
    }
    .report-link {
      color: #ff4444;
      text-decoration: none;
      font-size: 12px;
      margin-left: 5px;
    }
    .report-link:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <h3 style="margin-bottom: 5px;">🛡️ PhishShield</h3>
  <div style="font-size: 10px; color: #666; margin-bottom: 10px;">by Sanobar Shaikh</div>
  
  <div id="dashboard" style="background: #f0f7ff; padding: 10px; border-radius: 8px; margin-bottom: 15px; display: flex; justify-content: space-around; align-items: center;">
    <div style="text-align: center;">
      <div style="font-size: 10px; color: #555;">Shield Status</div>
      <div id="shield-health" style="font-size: 18px; font-weight: bold; color: #4CAF50;">Active</div>
    </div>
    <div style="width: 1px; height: 30px; background: #cce4ff;"></div>
    <div style="text-align: center;">
      <div style="font-size: 10px; color: #555;">Safety Score</div>
      <div id="safety-score" style="font-size: 18px; font-weight: bold; color: #2196F3;">100%</div>
    </div>
  </div>

  <div id="currentStatus">
    <div id="loading" style="display:none; margin-top: 10px;">⏳ Scanning...</div>
    <div id="result" style="margin-top: 10px;"></div>
  </div>

  <hr>
  <h4>📜 Recent Scans</h4>
  <div id="history"></div>

  <div class="footer" style="text-align: center; margin-top: 15px; font-size: 10px; color: #777; border-top: 1px solid #eee; padding-top: 10px;">
    Secure Browsing active 🛡️
  </div>

  <script src="popup.js"></script>
</body>
</html>
